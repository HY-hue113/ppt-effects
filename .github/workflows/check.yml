name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install python-pptx Pillow lxml

      - name: Specs parse
        run: |
          python - <<'PY'
          import glob, json, sys
          bad = []
          for p in sorted(glob.glob('effects/*/spec.json')):
              try:
                  json.load(open(p, encoding='utf-8'))
              except Exception as e:
                  bad.append((p, e))
          print('specs:', len(glob.glob('effects/*/spec.json')))
          sys.exit(1 if bad else 0)
          PY

      - name: Materials spec listing
        run: python tools/check_materials.py --list

      - name: Recipe/reference consistency
        run: |
          python - <<'PY'
          import glob, os, sys
          bad = []
          skipped = []
          for d in sorted(glob.glob('effects/*')):
              # 纯素材目录（如 academic）没有 spec.json，跳过
              if not os.path.isfile(os.path.join(d, 'spec.json')):
                  skipped.append(d)
                  continue
              if not os.path.isfile(os.path.join(d, 'recipe.md')):
                  bad.append(d + ' 缺 recipe.md')
              if not glob.glob(os.path.join(d, 'reference', '*.pptx')):
                  bad.append(d + ' 缺 reference/*.pptx')
          if skipped:
              print('素材目录（无 spec，跳过）: ' + ', '.join(skipped))
          print('\n'.join(bad) or 'structure ok')
          sys.exit(1 if bad else 0)
          PY

      - name: Tool zones present
        run: |
          python - <<'PY'
          import os, sys
          # 只发两模式用到的工具区；版式/文本/图片区随工作台提供
          need = ['palette-tools', 'template-tools']
          missing = [z for z in need if not os.path.isdir(z)]
          print('missing:', missing or 'none')
          sys.exit(1 if missing else 0)
          PY
